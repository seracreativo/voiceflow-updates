<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430"
     role="img" aria-label="Pegas la licencia una vez, se verifica la firma en tu propio Mac sin conexión ni servidor, y aparece sola en tus otros dispositivos por el Llavero de iCloud">
  <style>
    .lienzo{fill:#ffffff} .barra{fill:#f2f2f0}
    .borde{stroke:#e4e4e0;stroke-width:1;fill:none}
    .panel{fill:#f7f7f5}
    .rotulo{fill:#8a8a93;font:500 13px 'Inter Tight',system-ui,sans-serif;letter-spacing:1.4px}
    .suave{fill:#8a8a93;font:400 17px 'Inter Tight',system-ui,sans-serif}
    .fuerte{fill:#101014;font:500 18px 'Inter Tight',system-ui,sans-serif}
    .clave{fill:#55555e;font:400 15px ui-monospace,SFMono-Regular,Menlo,monospace}
    .verde{fill:#16a34a;font:500 15px 'Inter Tight',system-ui,sans-serif}
    .verdetrazo{stroke:#16a34a;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .gristrazo{stroke:#c2c2c9;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .disp{fill:#ececea} .dispborde{stroke:#d8d8d4;stroke-width:1.4;fill:none}
    .p1{fill:#ff5f57} .p2{fill:#febc2e} .p3{fill:#28c840}
    .nube{fill:none;stroke:#c2c2c9;stroke-width:1.8;stroke-dasharray:5 5}
    .tacha{stroke:#d76b6b;stroke-width:2;stroke-linecap:round}
    @media (prefers-color-scheme:dark){
      .lienzo{fill:#151519} .barra{fill:#1d1d22} .borde{stroke:#2a2a32} .panel{fill:#1b1b21}
      .rotulo{fill:#86868f} .suave{fill:#86868f} .fuerte{fill:#f0f0f4} .clave{fill:#b9b9c2}
      .verde{fill:#4ade80} .verdetrazo{stroke:#4ade80}
      .disp{fill:#26262e} .dispborde{stroke:#3a3a44} .gristrazo{stroke:#55555e} .nube{stroke:#55555e}
    }
  </style>
  <rect x="1" y="1" width="718" height="428" rx="14" class="lienzo"/>
  <path d="M1 15a14 14 0 0 1 14-14h690a14 14 0 0 1 14 14v26H1z" class="barra"/>
  <circle cx="26" cy="21" r="6" class="p1"/>
  <circle cx="46" cy="21" r="6" class="p2"/>
  <circle cx="66" cy="21" r="6" class="p3"/>
  <line x1="1" y1="41" x2="719" y2="41" class="borde"/>
  <rect x="1" y="1" width="718" height="428" rx="14" class="borde"/>

  <text x="40" y="82" class="rotulo">LA PEGAS UNA VEZ</text>
  <rect x="32" y="98" width="656" height="52" rx="10" class="panel"/>
  <text x="52" y="130" class="clave">VF1.eyJ2IjoxLCJlIjoiYW5hQGVqZW1wbG8uY29tIiwicCI6InBybyJ9…</text>

  <path d="M360 166v26m0 0-8-8m8 8 8-8" class="verdetrazo"/>

  <rect x="32" y="196" width="656" height="92" rx="12" class="panel"/>
  <circle cx="72" cy="242" r="15" class="verdetrazo"/>
  <path d="M65 242l5 5 10-11" class="verdetrazo"/>
  <text x="102" y="236" class="fuerte">Firma verificada en este Mac</text>
  <text x="102" y="260" class="suave">Sin conexión. Sin cuenta. Sin preguntar a nadie.</text>

  <g id="sinservidor" transform="translate(590,236)">
    <!-- Contorno de nube clásico, dibujado a su tamaño natural y encogido con `scale`.
         El `translate` de dentro lo centra: sale de medir el `getBBox()` real del path,
         porque un contorno de nube no es simétrico respecto a sus coordenadas. -->
    <g transform="scale(0.46) translate(-50,-40)">
      <path id="nube" class="nube"
            d="M25 60a20 20 0 0 1 0-40 10 10 0 0 1 20-10 15 15 0 0 1 30 10 15 15 0 0 1 0 40z"/>
    </g>
    <line x1="-13" y1="4" x2="13" y2="-14" class="tacha"/>
    <text id="rotnube" x="0" y="30" text-anchor="middle" class="suave" style="font-size:13px">ningún servidor</text>
  </g>

  <text x="40" y="322" class="rotulo">Y APARECE EN TUS OTROS DISPOSITIVOS</text>
  <g transform="translate(92,336) scale(0.72)"><rect x="0" y="0" width="86" height="56" rx="6" class="disp"/><rect x="0" y="0" width="86" height="56" rx="6" class="dispborde"/><path d="M-10 62h106a6 6 0 0 1-6 6H-4a6 6 0 0 1-6-6z" class="disp"/><path d="M-10 62h106a6 6 0 0 1-6 6H-4a6 6 0 0 1-6-6z" class="dispborde"/></g>
  <g transform="translate(214,334) scale(0.72)"><rect x="0" y="0" width="52" height="70" rx="7" class="disp"/><rect x="0" y="0" width="52" height="70" rx="7" class="dispborde"/></g>
  <g transform="translate(300,336) scale(0.72)"><rect x="0" y="0" width="34" height="62" rx="7" class="disp"/><rect x="0" y="0" width="34" height="62" rx="7" class="dispborde"/></g>
  <path d="M170 366h34M258 366h32" class="gristrazo"/>
  <text x="368" y="360" class="verde">✓ Por el Llavero de iCloud</text>
  <text x="368" y="384" class="suave" style="font-size:15px">Se compra una vez, no una por aparato.</text>
</svg>
