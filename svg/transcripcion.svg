<svg class="grafico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"
     width="720" height="400" role="img" aria-label="De lo que dices a lo que se escribe: «eh… nos vemos mañana a las dos, no, mejor a las tres» se convierte en «Nos vemos mañana a las tres.»">
  <rect x="1" y="1" width="718" height="398" rx="14" class="lienzo"/>
  <path d="M1 15a14 14 0 0 1 14-14h690a14 14 0 0 1 14 14v26H1z" class="barra"/>
  <circle cx="26" cy="21" r="6" class="p1"/>
  <circle cx="46" cy="21" r="6" class="p2"/>
  <circle cx="66" cy="21" r="6" class="p3"/>
  <line x1="1" y1="41" x2="719" y2="41" class="borde"/>
  <rect x="1" y="1" width="718" height="398" rx="14" class="borde"/>

  <text x="40" y="90" class="rotulo">LO QUE DICES</text>
  <rect x="32" y="104" width="656" height="86" rx="11" class="panel"/>
  <text x="52" y="140" class="suave"><tspan class="tacha">eh…</tspan> nos vemos mañana a <tspan class="tacha">las dos,</tspan></text>
  <text x="52" y="168" class="suave"><tspan class="tacha">no, mejor</tspan> a las tres</text>

  <path d="M360 208v34m0 0-9-9m9 9 9-9" class="flecha"/>

  <text x="40" y="288" class="rotulo">LO QUE SE ESCRIBE</text>
  <rect x="32" y="302" width="656" height="62" rx="11" class="panel"/>
  <text x="52" y="341" class="fuerte">Nos vemos mañana a las tres.</text>
</svg>
