<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" width="720" height="452"
     role="img" aria-label="Los tres niveles de pulido aplicados a la misma frase: Literal la deja tal cual, Limpio la puntúa y Redactado la reescribe">
  <style>
    .lienzo  { fill: #ffffff; }
    .barra   { fill: #f2f2f0; }
    .borde   { stroke: #e4e4e0; stroke-width: 1; fill: none; }
    .panel   { fill: #f7f7f5; }
    .rotulo  { fill: #8a8a93; font: 500 13px 'Inter Tight', system-ui, sans-serif; letter-spacing: 1.4px; }
    .suave   { fill: #8a8a93; font: 400 19px 'Inter Tight', system-ui, sans-serif; }
    .fuerte  { fill: #101014; font: 500 19px 'Inter Tight', system-ui, sans-serif; }
    .chip    { fill: #ececea; }
    .chiptxt { fill: #55555e; font: 500 14px 'Inter Tight', system-ui, sans-serif; }
    .verde   { fill: #16a34a; font: 500 14px 'Inter Tight', system-ui, sans-serif; }
    .flecha  { stroke: #16a34a; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .tacha   { fill: #c9c9cf; text-decoration: line-through; }
    .p1 { fill: #ff5f57; } .p2 { fill: #febc2e; } .p3 { fill: #28c840; }
    .capsula { fill: #16161a; }
    .onda    { stroke: #34e07a; stroke-width: 3; stroke-linecap: round; }
    .capstxt { fill: #34e07a; font: 500 15px 'Inter Tight', system-ui, sans-serif; }
    .sel     { fill: #b9d4ff; }
    @media (prefers-color-scheme: dark) {
      .lienzo { fill: #151519; } .barra { fill: #1d1d22; }
      .borde  { stroke: #2a2a32; } .panel { fill: #1b1b21; }
      .rotulo { fill: #86868f; } .suave { fill: #86868f; }
      .fuerte { fill: #f0f0f4; } .chip { fill: #26262e; } .chiptxt { fill: #b9b9c2; }
      .verde  { fill: #4ade80; } .flecha { stroke: #4ade80; }
      .tacha  { fill: #55555e; } .sel { fill: #24405f; }
    }
  </style>
  <rect x="1" y="1" width="718" height="450" rx="14" class="lienzo"/>
  <path d="M1 15a14 14 0 0 1 14-14h690a14 14 0 0 1 14 14v26H1z" class="barra"/>
  <circle cx="26" cy="21" r="6" class="p1"/>
  <circle cx="46" cy="21" r="6" class="p2"/>
  <circle cx="66" cy="21" r="6" class="p3"/>
  <line x1="1" y1="41" x2="719" y2="41" class="borde"/>
  <rect x="1" y="1" width="718" height="450" rx="14" class="borde"/>

  <text x="40" y="82" class="rotulo">LO QUE DIJISTE</text>
  <text x="40" y="112" class="suave"><tspan class="tacha">bueno</tspan> mándale el informe a marta el jueves</text>
  <path d="M360 130v26m0 0-8-8m8 8 8-8" class="flecha"/>
  <rect x="32" y="174" width="656" height="76" rx="11" class="panel"/>
  <text x="54" y="204" class="rotulo">LITERAL · TERMINAL Y CÓDIGO</text>
  <text x="54" y="234" class="suave">bueno mándale el informe a marta el jueves</text>
  <rect x="32" y="262" width="656" height="76" rx="11" class="panel"/>
  <text x="54" y="292" class="rotulo">LIMPIO · NOTAS Y MENSAJES</text>
  <text x="54" y="322" class="suave">Mándale el informe a Marta el jueves.</text>
  <rect x="32" y="350" width="656" height="76" rx="11" class="panel"/>
  <text x="54" y="380" class="rotulo">REDACTADO · CORREOS</text>
  <text x="54" y="410" class="fuerte">Te envío el informe a Marta el jueves.</text>
</svg>
