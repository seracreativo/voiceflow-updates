<svg class="grafico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452"
     width="720" height="452" role="img" aria-label="The three polish levels applied to the same sentence: Verbatim leaves it as spoken, Clean punctuates it and Polished rewrites it">
  <rect x="1" y="1" width="718" height="450" rx="14" class="lienzo"/>
  <path d="M1 15a14 14 0 0 1 14-14h690a14 14 0 0 1 14 14v26H1z" class="barra"/>
  <circle cx="26" cy="21" r="6" class="p1"/>
  <circle cx="46" cy="21" r="6" class="p2"/>
  <circle cx="66" cy="21" r="6" class="p3"/>
  <line x1="1" y1="41" x2="719" y2="41" class="borde"/>
  <rect x="1" y="1" width="718" height="450" rx="14" class="borde"/>

  <text x="40" y="82" class="rotulo">WHAT YOU SAID</text>
  <text x="40" y="112" class="suave"><tspan class="tacha">so</tspan> let's move tomorrow's meeting Marta can't make it better Thursday</text>
  <path d="M360 130v26m0 0-8-8m8 8 8-8" class="flecha"/>
  <rect x="32" y="174" width="656" height="76" rx="11" class="panel"/>
  <text x="54" y="204" class="rotulo">VERBATIM · TERMINAL AND CODE</text>
  <text x="54" y="234" class="suave">let's move tomorrow's meeting Marta can't make it better Thursday</text>
  <rect x="32" y="262" width="656" height="76" rx="11" class="panel"/>
  <text x="54" y="292" class="rotulo">CLEAN · NOTES AND MESSAGES</text>
  <text x="54" y="322" class="suave">Let's move tomorrow's meeting, Marta can't make it, better Thursday.</text>
  <rect x="32" y="350" width="656" height="76" rx="11" class="panel"/>
  <text x="54" y="380" class="rotulo">POLISHED · EMAIL</text>
  <text x="54" y="410" class="fuerte">Moving tomorrow's meeting to Thursday: Marta can't make it.</text>
</svg>
