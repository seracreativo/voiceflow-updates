<svg class="grafico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"
     width="720" height="400" role="img" aria-label="Seleccionas un texto en español, pulsas el atajo y aparece una ventanita con la traducción al inglés, con las acciones de copiar y sustituir">
  <rect x="1" y="1" width="718" height="398" rx="14" class="lienzo"/>
  <path d="M1 15a14 14 0 0 1 14-14h690a14 14 0 0 1 14 14v26H1z" class="barra"/>
  <circle cx="26" cy="21" r="6" class="p1"/>
  <circle cx="46" cy="21" r="6" class="p2"/>
  <circle cx="66" cy="21" r="6" class="p3"/>
  <line x1="1" y1="41" x2="719" y2="41" class="borde"/>
  <rect x="1" y="1" width="718" height="398" rx="14" class="borde"/>

  <text x="40" y="82" class="rotulo">SELECT IT AND PRESS THE SHORTCUT</text>
  <rect x="52" y="98" width="404" height="28" rx="4" class="sel"/>
  <text x="54" y="120" class="fuerte">See you tomorrow at three.</text>

  <rect x="112" y="164" width="496" height="180" rx="16" class="capsula"/>
  <text x="140" y="202" class="capstxt">Spanish → English</text>
  <path d="M262 190h16m0 0-5-5m5 5-5 5M278 198h-16m0 0 5-5m-5 5 5 5" class="flecha"/>
  <text x="578" y="203" class="capsdebil">✕</text>
  <text x="140" y="252" class="capsfuerte">See you tomorrow at three.</text>
  <rect x="332" y="282" width="118" height="40" rx="20" class="btn2"/>
  <text x="352" y="308" class="btn2txt">Copy <tspan class="btn2tecla">⌘C</tspan></text>
  <rect x="462" y="282" width="122" height="40" rx="20" class="btn1"/>
  <text x="482" y="308" class="btn1txt">Replace <tspan class="btn1tecla">⏎</tspan></text>

  <text x="40" y="382" class="rotulo">IT REPLACES THE TEXT IN PLACE</text>
</svg>
