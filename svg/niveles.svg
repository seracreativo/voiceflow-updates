<svg class="grafico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452"
     width="720" height="452" role="img" aria-label="Los tres niveles de pulido aplicados a la misma frase: Literal la deja tal cual, Limpio la puntúa y Redactado la reescribe">
