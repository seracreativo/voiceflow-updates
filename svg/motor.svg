<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420"
     role="img" aria-label="Por defecto usa el motor de macOS, que no descarga nada. Como alternativa se puede descargar Whisper, que también corre en el Mac: Pequeño 181 MB, Turbo 547 MB y Grande 1 GB, con más precisión a cambio de más peso">
  <style>
    .lienzo{fill:#ffffff} .barra{fill:#f2f2f0}
    .borde{stroke:#e4e4e0;stroke-width:1;fill:none}
    .panel{fill:#f7f7f5} .panelsel{fill:#eef4ff}
    .selborde{stroke:#2f6df6;stroke-width:1.5;fill:none}
    .rotulo{fill:#8a8a93;font:500 12px 'Inter Tight',system-ui,sans-serif;letter-spacing:1.3px}
    .suave{fill:#8a8a93;font:400 15px 'Inter Tight',system-ui,sans-serif}
    .fuerte{fill:#101014;font:500 18px 'Inter Tight',system-ui,sans-serif}
    .dato{fill:#55555e;font:400 14px 'Inter Tight',system-ui,sans-serif}
    .azul{fill:#2f6df6;font:500 12px 'Inter Tight',system-ui,sans-serif;letter-spacing:1.3px}
    .verde{fill:#16a34a;font:500 14px 'Inter Tight',system-ui,sans-serif}
    .barrafondo{fill:#e4e4e0} .barrallena{fill:#16a34a}
    .p1{fill:#ff5f57} .p2{fill:#febc2e} .p3{fill:#28c840}
    @media (prefers-color-scheme:dark){
      .lienzo{fill:#151519} .barra{fill:#1d1d22} .borde{stroke:#2a2a32}
      .panel{fill:#1b1b21} .panelsel{fill:#16233a} .rotulo{fill:#86868f}
      .suave{fill:#86868f} .fuerte{fill:#f0f0f4} .dato{fill:#b9b9c2}
      .azul{fill:#7ba2ff} .verde{fill:#4ade80} .barrafondo{fill:#2a2a32} .barrallena{fill:#4ade80}
    }
  </style>
  <rect x="1" y="1" width="718" height="418" rx="14" class="lienzo"/>
  <path d="M1 15a14 14 0 0 1 14-14h690a14 14 0 0 1 14 14v26H1z" class="barra"/>
  <circle cx="26" cy="21" r="6" class="p1"/><circle cx="46" cy="21" r="6" class="p2"/><circle cx="66" cy="21" r="6" class="p3"/>
  <line x1="1" y1="41" x2="719" y2="41" class="borde"/>
  <rect x="1" y="1" width="718" height="418" rx="14" class="borde"/>

  <text x="40" y="76" class="rotulo">POR DEFECTO · NO DESCARGA NADA</text>
  <text x="666" y="76" class="rotulo" text-anchor="end">ACIERTO EN ESPAÑOL</text>
  <rect x="32" y="90" width="656" height="62" rx="11" class="panelsel"/>
  <rect x="32" y="90" width="656" height="62" rx="11" class="selborde"/>
  <text x="54" y="117" class="fuerte">Motor de macOS</text>
  <text x="54" y="138" class="dato">Ya está en el sistema. Arranca al instante.</text>
  <text x="470" y="117" class="dato" text-anchor="end">0 MB</text>
  <rect x="490" y="110" width="176" height="7" rx="3.5" class="barrafondo"/>
  <rect x="490" y="110" width="109" height="7" rx="3.5" class="barrallena"/>
  <text x="666" y="138" class="azul" text-anchor="end">EN USO</text>
  <text x="40" y="196" class="rotulo">OPCIONAL · WHISPER, TAMBIÉN EN TU MAC</text>
  <rect x="32" y="210" width="656" height="62" rx="11" class="panel"/>
  <text x="54" y="237" class="fuerte">Pequeño</text>
  <text x="54" y="258" class="dato">Equilibrado, suficiente para dictado en español.</text>
  <text x="470" y="237" class="dato" text-anchor="end">181 MB</text>
  <rect x="490" y="230" width="176" height="7" rx="3.5" class="barrafondo"/>
  <rect x="490" y="230" width="123" height="7" rx="3.5" class="barrallena"/>
  <rect x="32" y="282" width="656" height="62" rx="11" class="panel"/>
  <text x="54" y="309" class="fuerte">Turbo</text>
  <text x="54" y="330" class="dato">Acierta casi como el grande y corre mucho más rápido.</text>
  <text x="470" y="309" class="dato" text-anchor="end">547 MB</text>
  <rect x="490" y="302" width="176" height="7" rx="3.5" class="barrafondo"/>
  <rect x="490" y="302" width="162" height="7" rx="3.5" class="barrallena"/>
  <rect x="32" y="354" width="656" height="62" rx="11" class="panel"/>
  <text x="54" y="381" class="fuerte">Grande</text>
  <text x="54" y="402" class="dato">El más preciso, y el que más tarda y más ocupa.</text>
  <text x="470" y="381" class="dato" text-anchor="end">1 GB</text>
  <rect x="490" y="374" width="176" height="7" rx="3.5" class="barrafondo"/>
  <rect x="490" y="374" width="176" height="7" rx="3.5" class="barrallena"/>
</svg>
